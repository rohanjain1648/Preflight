modules:
  jira:issueContext:
    - key: preflight-panel
      title: Preflight
      label: Preflight
      resource: panel
      render: native
      resolver:
        function: resolver
  action:
    - key: spike-hello
      name: Spike hello
      function: spike-hello-fn
      actionVerb: GET
      description: Spike action that greets by name.
      inputs:
        name:
          title: Name
          description: Who to greet.
          type: string
          required: true
  rovo:mcp:
    - key: preflight-mcp
      name: Preflight
      tools:
        - spike-hello
  sql:
    - key: main
      engine: mysql
  llm:
    - key: main-llm
      model:
        - claude
  trigger:
    - key: lifecycle
      function: lifecycle-fn
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app
  function:
    - key: resolver
      handler: index.resolver
    - key: lifecycle-fn
      handler: index.lifecycle
    - key: spike-hello-fn
      handler: index.spikeHello
resources:
  - key: panel
    path: src/frontend/panel.tsx
permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - storage:app
    - read:graph:user:atlassian
    - read:graph:team:atlassian
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/459344e3-43be-494c-9f97-59a1312e8320
